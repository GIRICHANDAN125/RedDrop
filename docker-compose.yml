version: '3.8'

services:
  # MySQL Database Container
  mysql:
    image: mysql:8.0
    container_name: reddropai-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root_password_123
      MYSQL_DATABASE: reddropai
      MYSQL_USER: reddrop_user
      MYSQL_PASSWORD: reddrop_password_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema_v2.sql:/docker-entrypoint-initdb.d/01_schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password_123"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Queue Broker Container
  redis:
    image: redis:7-alpine
    container_name: reddropai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API & Socket.IO Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reddropai-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: mysql
      DB_USER: reddrop_user
      DB_PASSWORD: reddrop_password_123
      DB_NAME: reddropai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: production_super_secret_jwt_key_998877
    ports:
      - "5000:5000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Frontend Mobile Web Container
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reddropai-frontend
    restart: always
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
